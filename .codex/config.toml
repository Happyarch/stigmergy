sandbox_mode = "workspace-write"
approval_policy = "never"

[sandbox_workspace_write]
network_access = true

[features.network_proxy]
enabled = true

[features.network_proxy.domains]
"**.openai.com" = "allow"
"**.chatgpt.com" = "allow"

# >>> stigmergy managed block — do not edit; `stigmergy init` regenerates it >>>
[mcp_servers.stigmergy]
command = "stigmergy"
args = ["mcp"]
startup_timeout_sec = 10.0
tool_timeout_sec = 60.0

[mcp_servers.stigmergy.tools.context_open]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.root_register]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.memory_search]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.mailbox_inbox]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.mailbox_send]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.memory_list]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.root_list_active]
approval_mode = "approve"

[mcp_servers.stigmergy.tools.mailbox_mark_read]
approval_mode = "approve"

[memories]
use_memories = false
